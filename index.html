<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minders · Org Chart Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap');
:root {
  --bg:#1c1f24;--surface:#22252b;--surface2:#2a2d35;
  --border:rgba(242,242,242,.12);--border2:rgba(242,242,242,.2);
  --text:#f2f2f2;--text2:rgba(242,242,242,.5);--text3:rgba(242,242,242,.25);
  --lav:#8799fb;--cyan:#a4f1fb;--mint:#b1fbae;--pink:#fc9edc;--coral:#fc7e7f;
  --display:'Archivo Black','Arial Black',sans-serif;
  --mono:'Space Mono','Courier New',monospace;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}
#s-login{align-items:center;justify-content:center;display:flex;}

/* LOGIN */
.login-wrap{width:380px;}
.login-logo{font-family:var(--display);font-size:32px;color:var(--text);margin-bottom:40px;}
.login-logo span{color:var(--lav);}
.login-sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:32px;}
.f{margin-bottom:14px;}
.f label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:5px;}
.f input{width:100%;background:rgba(242,242,242,.05);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--text);font-family:var(--mono);outline:none;transition:border-color .15s;}
.f input::placeholder{color:var(--text3);}
.f input:focus{border-color:var(--lav);}
.btn-p{width:100%;background:var(--text);color:var(--bg);border:none;border-radius:10px;padding:13px;font-family:var(--display);font-size:14px;cursor:pointer;transition:opacity .15s;margin-top:8px;}
.btn-p:hover{opacity:.85;}
.login-err{font-size:11px;color:var(--coral);margin-top:10px;min-height:16px;}
.login-hint{font-size:10px;color:var(--text3);margin-top:20px;text-align:center;}

/* TOPBAR */
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:100;flex-shrink:0;}
.topbar-logo{font-family:var(--display);font-size:16px;color:var(--text);flex-shrink:0;}
.topbar-logo span{color:var(--lav);}
.tdiv{width:1px;height:20px;background:var(--border);}
.topbar-title{font-size:11px;color:var(--text2);flex:1;letter-spacing:.04em;}
.tactions{display:flex;align-items:center;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);font-weight:700;cursor:pointer;transition:all .12s;border:1px solid var(--border2);background:none;color:var(--text2);white-space:nowrap;}
.chip:hover{border-color:var(--text2);color:var(--text);}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.chip.lav{background:var(--lav);color:var(--bg);border-color:var(--lav);}
.chip.mint{background:var(--mint);color:var(--bg);border-color:var(--mint);}
.chip.cyan{background:var(--cyan);color:var(--bg);border-color:var(--cyan);}
.chip.pink{background:var(--pink);color:var(--bg);border-color:var(--pink);}
.chip.coral{background:var(--coral);color:var(--bg);border-color:var(--coral);}
.chip.sm{padding:3px 8px;font-size:9px;}

/* HUB */
#s-hub{background:var(--bg);}
.hub-canvas{flex:1;padding:40px 32px 80px;overflow-y:auto;}
.hub-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:40px;flex-wrap:wrap;gap:16px;}
.hub-title{font-family:var(--display);font-size:36px;letter-spacing:-.02em;color:var(--text);}
.hub-title span{color:var(--lav);}
.region-block{margin-bottom:48px;}
.region-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.region-label{font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);}
.region-count{font-size:10px;color:var(--text3);letter-spacing:.06em;}
.owner-section{margin-bottom:28px;}
.owner-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.owner-dot{width:6px;height:6px;border-radius:50%;background:var(--lav);flex-shrink:0;}
.accounts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.account-card{background:rgba(242,242,242,.04);border:1px solid var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.account-card:hover{background:rgba(242,242,242,.08);border-color:var(--border2);transform:translateY(-2px);}
.account-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.account-card.br::before{background:var(--mint);}
.account-card.nola::before{background:var(--lav);}
.account-card.sola::before{background:var(--cyan);}
.account-card.iberia::before{background:var(--pink);}
.ac-name{font-family:var(--display);font-size:15px;letter-spacing:-.01em;color:var(--text);margin-bottom:5px;line-height:1.2;}
.ac-seg{font-size:10px;color:var(--text2);margin-bottom:10px;}
.ac-meta{display:flex;flex-wrap:wrap;gap:5px;}
.ac-people{font-size:10px;color:var(--text3);margin-top:10px;letter-spacing:.04em;}
.account-card-add{background:none;border:1px dashed var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;min-height:110px;}
.account-card-add:hover{border-color:var(--lav);color:var(--lav);}
.region-empty{font-size:11px;color:var(--text3);padding:12px 0;letter-spacing:.04em;}

/* CHART */
#s-chart{background:var(--bg);}
.chart-canvas{flex:1;overflow:auto;padding:36px 32px 100px;display:flex;flex-direction:column;align-items:center;}
.account-metabar{width:100%;max-width:1100px;display:flex;align-items:center;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.chart-legend{width:100%;max-width:1100px;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text2);}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.import-panel{width:100%;max-width:1100px;background:rgba(242,242,242,.04);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:22px;}
.import-panel summary{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);cursor:pointer;user-select:none;list-style:none;display:flex;align-items:center;gap:8px;}
.import-panel summary::-webkit-details-marker{display:none;}
.import-panel summary::before{content:'▶';font-size:9px;color:var(--text3);transition:transform .15s;}
.import-panel[open] summary::before{transform:rotate(90deg);}
.import-panel textarea{width:100%;margin-top:12px;background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:12px;font-size:11px;font-family:var(--mono);color:var(--cyan);resize:vertical;min-height:80px;outline:none;}
.import-actions{display:flex;gap:8px;margin-top:8px;}
#org-tree{width:100%;max-width:1100px;}
.tree-root{display:flex;flex-direction:column;align-items:center;}
.tree-node{display:flex;flex-direction:column;align-items:center;}
.vl{width:2px;background:var(--border);flex-shrink:0;}
.children-wrap{display:flex;flex-direction:column;align-items:center;}
.children-row{display:flex;gap:12px;align-items:flex-start;position:relative;}
.child-col{display:flex;flex-direction:column;align-items:center;}

/* CARD */
.card{width:192px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 12px 10px;cursor:grab;transition:all .15s;position:relative;flex-shrink:0;user-select:none;}
.card:hover{background:var(--surface2);border-color:var(--border2);}
.card.dragging{opacity:.3;cursor:grabbing;}
.card.drag-over-above{border-top:2px solid var(--lav);}
.card.drag-over-below{border-bottom:2px solid var(--lav);}
.card.drag-over-side{border:2px dashed var(--lav);}
.card-top{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:10px;color:var(--text);flex-shrink:0;text-decoration:none;transition:border-color .12s;letter-spacing:-.01em;}
a.avatar:hover{border-color:var(--lav);}
.card-info{flex:1;min-width:0;}
.card-name{font-family:var(--display);font-size:11px;letter-spacing:-.01em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.card-role{font-size:10px;color:var(--text2);margin-top:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-labels{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;}
.label-tag{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 5px;border-radius:4px;}
.card-note{font-size:9px;color:var(--text3);margin-top:5px;line-height:1.5;font-style:italic;}
.card-li{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:9px;color:var(--text3);text-decoration:none;transition:color .12s;letter-spacing:.04em;}
.card-li:hover{color:var(--lav);}
.add-child-btn{width:28px;height:20px;border:1px dashed var(--border);border-radius:6px;background:none;color:var(--text3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;}
.add-child-btn:hover{border-color:var(--lav);color:var(--lav);}
.drag-hint{font-size:10px;color:var(--text3);margin-top:10px;letter-spacing:.06em;}
.empty-state{text-align:center;padding:80px 20px;width:100%;}
.empty-state h2{font-family:var(--display);font-size:28px;letter-spacing:-.02em;color:var(--text);margin-bottom:12px;}
.empty-state p{font-size:12px;color:var(--text2);line-height:1.7;max-width:320px;margin:0 auto 28px;}

/* MODALS */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(28,31,36,.85);z-index:300;align-items:center;justify-content:center;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:#22252b;border:1px solid var(--border2);border-radius:var(--r);padding:26px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
.modal h2{font-family:var(--display);font-size:18px;letter-spacing:-.01em;color:var(--text);margin-bottom:20px;}
.mf{margin-bottom:13px;}
.mf label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:5px;}
.mf input,.mf select{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--text);font-family:var(--mono);outline:none;transition:border-color .12s;}
.mf input::placeholder{color:var(--text3);}
.mf input:focus,.mf select:focus{border-color:var(--lav);}
.mf select option{background:#22252b;}
.iw{position:relative;}
.iw input{padding-left:30px;}
.iw .ii{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.3;pointer-events:none;}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.ro{display:flex;align-items:center;justify-content:center;padding:11px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-family:var(--display);font-size:13px;letter-spacing:-.01em;color:var(--text2);transition:all .12s;user-select:none;}
.ro input{display:none;}
.ro.sel{color:var(--bg);}
.ro.br.sel{background:var(--mint);border-color:var(--mint);}
.ro.nola.sel{background:var(--lav);border-color:var(--lav);}
.ro.sola.sel{background:var(--cyan);border-color:var(--cyan);}
.ro.iberia.sel{background:var(--pink);border-color:var(--pink);}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.lt{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--text2);transition:all .12s;user-select:none;background:var(--bg);}
.lt input{display:none;}
.lt .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.lt.active{color:var(--text);border-color:transparent;}
.mactions{display:flex;gap:8px;margin-top:20px;}
.btn-ms{flex:1;background:var(--text);color:var(--bg);border:none;border-radius:10px;padding:11px;font-family:var(--display);font-size:13px;cursor:pointer;}
.btn-mc{flex:1;background:rgba(242,242,242,.05);color:var(--text2);border:1px solid var(--border);border-radius:10px;padding:11px;font-size:12px;cursor:pointer;font-family:var(--mono);}
.btn-md{background:none;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:15px;cursor:pointer;color:var(--text3);transition:all .12s;}
.btn-md:hover{border-color:var(--coral);color:var(--coral);}

/* TOAST / OVERLAY */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px 18px;font-size:11px;color:var(--text);z-index:999;transition:transform .25s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;letter-spacing:.04em;}
.toast.show{transform:translateX(-50%) translateY(0);}
.export-overlay{position:fixed;inset:0;background:var(--bg);z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.export-overlay.open{display:flex;}
.export-overlay p{font-size:12px;color:var(--text2);letter-spacing:.06em;}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--bg);z-index:400;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.loading-screen.hidden{display:none;}
.spinner{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--lav);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loading-screen">
  <div style="font-family:var(--display);font-size:20px;color:var(--text);">Minders<span style="color:var(--lav)">.</span></div>
  <div class="spinner"></div>
</div>

<!-- LOGIN -->
<div id="s-login" class="screen">
  <div class="login-wrap">
    <div class="login-logo">Minders<span>.</span></div>
    <div class="login-sub">Org Chart Hub · Restricted access</div>
    <div class="f"><label>Email</label><input type="email" id="login-email" placeholder="you@minders.io" autocomplete="email"></div>
    <div class="f"><label>Password</label><input type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-p" onclick="doLogin()">Sign in</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-hint">Access restricted to @minders.io</div>
  </div>
</div>

<!-- HUB -->
<div id="s-hub" class="screen">
  <div class="topbar">
    <div class="topbar-logo">Minders<span>.</span></div>
    <div class="tdiv"></div>
    <div class="topbar-title">Org Chart Hub</div>
    <div class="tactions">
      <button class="chip" onclick="openNewAccountModal()">+ New account</button>
      <button class="chip" id="user-chip" onclick="doLogout()">Sign out</button>
    </div>
  </div>
  <div class="hub-canvas">
    <div class="hub-header">
      <div class="hub-title">Accounts<span>.</span></div>
      <div id="hub-filter" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
    <div id="hub-body"></div>
  </div>
</div>

<!-- CHART -->
<div id="s-chart" class="screen">
  <div class="topbar">
    <div class="topbar-logo">Minders<span>.</span></div>
    <div class="tdiv"></div>
    <div id="topbar-bc" style="display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap;"></div>
    <div class="tactions">
      <button class="chip" onclick="openPersonModal(null,null)">+ Person</button>
      <button class="chip" onclick="openAccountEditModal()">⚙ Account</button>
      <button class="chip" onclick="zoomOut()">−</button>
      <span id="zoom-label" style="font-size:10px;color:var(--text2);min-width:32px;text-align:center;">100%</span>
      <button class="chip" onclick="zoomIn()">+</button>
      <button class="chip" onclick="exportImage()">↓ Image</button>
      <button class="chip" onclick="exportJSON()">↓ JSON</button>
      <button class="chip" onclick="goHub()">← Hub</button>
    </div>
  </div>
  <div class="chart-canvas">
    <div class="account-metabar" id="chart-metabar"></div>
    <div class="chart-legend" id="chart-legend"></div>
    <details class="import-panel" id="import-panel">
      <summary>↑ Paste JSON from Claude</summary>
      <textarea id="import-ta" placeholder="Paste JSON here and click Import..."></textarea>
      <div class="import-actions">
        <button class="chip" onclick="doImport()">Import</button>
        <button class="chip" onclick="document.getElementById('import-ta').value=''">Clear</button>
      </div>
    </details>
    <div id="org-tree"></div>
    <div class="drag-hint" id="drag-hint"></div>
  </div>
</div>

<!-- MODAL: new account -->
<div class="modal-bg" id="modal-new-account">
  <div class="modal">
    <h2>New account</h2>
    <div class="mf"><label>Company name</label><input id="na-name" type="text" placeholder="e.g. Jeitto, Caju, Konfío"></div>
    <div class="mf"><label>Segment</label><input id="na-segment" type="text" placeholder="e.g. Fintech, Retail, SaaS"></div>
    <div class="mf">
      <label>Region</label>
      <div class="rg" id="na-rg">
        <label class="ro br"><input type="radio" name="na-r" value="BR"> BR</label>
        <label class="ro nola"><input type="radio" name="na-r" value="NOLA"> NOLA</label>
        <label class="ro sola"><input type="radio" name="na-r" value="SOLA"> SOLA</label>
        <label class="ro iberia"><input type="radio" name="na-r" value="IBERIA"> IBERIA</label>
      </div>
    </div>
    <div class="mf"><label>BDR Owner</label><input id="na-bdr" type="text" placeholder="e.g. Floresta, Mari, Nacho"></div>
    <div class="mf"><label>Target product</label>
      <select id="na-product"><option value="">—</option><option>Amplitude</option><option>Braze</option><option>Amplitude + Braze</option></select>
    </div>
    <div class="mactions">
      <button class="btn-mc" onclick="closeModal('modal-new-account')">Cancel</button>
      <button class="btn-ms" onclick="createAccount()">Create</button>
    </div>
  </div>
</div>

<!-- MODAL: edit account -->
<div class="modal-bg" id="modal-edit-account">
  <div class="modal">
    <h2>Edit account</h2>
    <div class="mf"><label>Company name</label><input id="ea-name" type="text"></div>
    <div class="mf"><label>Segment</label><input id="ea-segment" type="text"></div>
    <div class="mf">
      <label>Region</label>
      <div class="rg" id="ea-rg">
        <label class="ro br"><input type="radio" name="ea-r" value="BR"> BR</label>
        <label class="ro nola"><input type="radio" name="ea-r" value="NOLA"> NOLA</label>
        <label class="ro sola"><input type="radio" name="ea-r" value="SOLA"> SOLA</label>
        <label class="ro iberia"><input type="radio" name="ea-r" value="IBERIA"> IBERIA</label>
      </div>
    </div>
    <div class="mf"><label>BDR Owner</label><input id="ea-bdr" type="text"></div>
    <div class="mf"><label>Stage</label>
      <select id="ea-stage"><option value="">—</option><option>Prospecting</option><option>Attempting to Contact</option><option>Connected</option><option>Qualified (S0)</option></select>
    </div>
    <div class="mf"><label>Target product</label>
      <select id="ea-product"><option value="">—</option><option>Amplitude</option><option>Braze</option><option>Amplitude + Braze</option></select>
    </div>
    <div class="mactions">
      <button class="btn-md" onclick="deleteAccount()" title="Delete account">🗑</button>
      <button class="btn-mc" onclick="closeModal('modal-edit-account')">Cancel</button>
      <button class="btn-ms" onclick="saveAccountEdit()">Save</button>
    </div>
  </div>
</div>

<!-- MODAL: person -->
<div class="modal-bg" id="modal-person">
  <div class="modal">
    <h2 id="mp-title">Add person</h2>
    <div class="mf"><label>Name</label><input id="mp-name" type="text" placeholder="Full name"></div>
    <div class="mf"><label>Title</label><input id="mp-role" type="text" placeholder="e.g. CFO, Head of Growth"></div>
    <div class="mf"><label>LinkedIn</label>
      <div class="iw">
        <svg class="ii" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
        <input id="mp-linkedin" type="url" placeholder="https://linkedin.com/in/...">
      </div>
    </div>
    <div class="mf"><label>Initials</label><input id="mp-initials" type="text" maxlength="3" placeholder="e.g. VS"></div>

// ── SUPABASE HELPERS ─────────────────────────────────
async function sb(path, opts={}) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SB_KEY,
      'Authorization': `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ── HUB ──────────────────────────────────────────────
function renderHub() {
  // filter chips
  const fEl = document.getElementById('hub-filter');
  fEl.innerHTML = ['ALL',...REGIONS].map(r=>`
    <button class="chip sm ${hubFilter===r?'active':''}" onclick="setFilter('${r}')">
      ${r==='ALL'?'All':r}
    </button>`).join('');

  const body = document.getElementById('hub-body');
  body.innerHTML = '';

  REGIONS.forEach(region => {
    if (hubFilter!=='ALL' && hubFilter!==region) return;
    const ras = allAccounts.filter(a=>a.region===region);
    const block = document.createElement('div');
    block.className='region-block';

    const rh = document.createElement('div');
    rh.className='region-header';
    rh.innerHTML=`
      <span class="chip sm ${RC[region]}">${region}</span>
      <span class="region-label">${regionName(region)}</span>
      <span class="region-count">${ras.length} account${ras.length!==1?'s':''}</span>`;
    block.appendChild(rh);

    if (ras.length===0) {
      const empty=document.createElement('div');
      empty.className='region-empty';
      empty.textContent='No accounts in this region yet.';
      block.appendChild(empty);
      const addBtn=makeAddAccountBtn(region,'');
      block.appendChild(addBtn);
    } else {
      // group by BDR
      const byBdr = {};
      ras.forEach(a => { const k=a.bdr||'No owner'; if(!byBdr[k])byBdr[k]=[]; byBdr[k].push(a); });
      Object.entries(byBdr).forEach(([bdr,accs]) => {
        const sec=document.createElement('div'); sec.className='owner-section';
        sec.innerHTML=`<div class="owner-label"><span class="owner-dot"></span>${bdr}</div>`;
        const grid=document.createElement('div'); grid.className='accounts-grid';
        accs.forEach(acc => grid.appendChild(makeAccountCard(acc)));
        grid.appendChild(makeAddAccountBtn(region,bdr));
        sec.appendChild(grid);
        block.appendChild(sec);
      });
      const newBtn=document.createElement('button');
      newBtn.className='chip sm'; newBtn.style.marginTop='8px';
      newBtn.textContent='+ Add account to region';
      newBtn.onclick=()=>openNewAccountModal(region,'');
      block.appendChild(newBtn);
    }
    body.appendChild(block);
  });
}

function setFilter(f) { hubFilter=f; renderHub(); }
function regionName(r) { return {BR:'Brazil',NOLA:'North LATAM',SOLA:'South LATAM',IBERIA:'Iberia'}[r]||r; }

function makeAccountCard(acc) {
  const card=document.createElement('div');
  card.className=`account-card ${(acc.region||'').toLowerCase()}`;

// ── ACCOUNT CRUD ─────────────────────────────────────

// ── CHART RENDER ─────────────────────────────────────
function renderChart() {
  renderBreadcrumb();
  renderMetabar();
  renderLegend();
  renderTree();
}

function renderBreadcrumb() {
  const a=currentAccount;
  const rc=RC[a?.region]||'';
  document.getElementById('topbar-bc').innerHTML=`
    <span class="chip sm" onclick="goHub()" style="cursor:pointer">Hub</span>

    ${a?.bdr?`<span class="chip sm">${a.bdr}</span>`:''}

function renderMetabar() {

    {k:'segment',v:a.segment||'+ Segment'},

}

function renderLegend() {
  const used=new Set(currentPeople.flatMap(p=>p.labels||[]));
  document.getElementById('chart-legend').innerHTML=used.size===0?'':
    LABELS.filter(l=>used.has(l.id)).map(l=>`
      <div class="legend-item">
        <div class="legend-dot" style="background:${l.color}"></div>
        <span>${l.label}</span>
      </div>`).join('');
}

function renderTree() {
  const container=document.getElementById('org-tree');
  container.innerHTML='';
  const people=currentPeople;

  if(people.length===0) {
    container.innerHTML=`
      <div class="empty-state">
        <h2>No people yet</h2>
        <p>Paste a JSON from Claude above, or add people manually.</p>
        <button class="btn-p" style="width:auto;padding:11px 28px;" onclick="openPersonModal(null,null)">+ Add person</button>
      </div>`;
    document.getElementById('drag-hint').textContent='';
    return;
  }
  document.getElementById('drag-hint').textContent='Drag cards to reorganize the hierarchy';

  const roots=people.filter(p=>!p.parent_id||p.parent_id==='');

  function buildNode(person) {
    const wrap=document.createElement('div'); wrap.className='tree-node';
    wrap.appendChild(makeCard(person));
    const cw=document.createElement('div'); cw.style.cssText='display:flex;flex-direction:column;align-items:center;';
    const vs=document.createElement('div'); vs.className='vl'; vs.style.height='14px';
    const ab=document.createElement('button'); ab.className='add-child-btn'; ab.textContent='+'; ab.title='Add direct report';
    ab.onclick=()=>openPersonModal(null,person.id);
    cw.appendChild(vs); cw.appendChild(ab); wrap.appendChild(cw);

    const children=people.filter(p=>p.parent_id===person.id);
    if(children.length>0) {
      const vd=document.createElement('div'); vd.className='vl'; vd.style.height='18px'; wrap.appendChild(vd);
      const chWrap=document.createElement('div'); chWrap.className='children-wrap';
      if(children.length===1) { chWrap.appendChild(buildNode(children[0])); }
      else {
        const row=document.createElement('div'); row.className='children-row';
        children.forEach(child=>{
          const col=document.createElement('div'); col.className='child-col';
          const vt=document.createElement('div'); vt.className='vl'; vt.style.height='20px';
          col.appendChild(vt); col.appendChild(buildNode(child)); row.appendChild(col);
        });
        chWrap.appendChild(row);
        setTimeout(()=>{
          const cols=row.querySelectorAll(':scope > .child-col');
          if(cols.length<2)return;
          const rr=row.getBoundingClientRect();
          const fr=cols[0].getBoundingClientRect();
          const lr=cols[cols.length-1].getBoundingClientRect();
          const l=fr.left-rr.left+fr.width/2;
          const r=lr.left-rr.left+lr.width/2;
          const hl=document.createElement('div');
          hl.style.cssText=`position:absolute;top:0;left:${l}px;width:${r-l}px;height:2px;background:var(--border);pointer-events:none;`;
          row.appendChild(hl);
        },0);
      }
      wrap.appendChild(chWrap);
    }
    return wrap;
  }

  const treeRoot=document.createElement('div'); treeRoot.className='tree-root';
  if(roots.length===1) { treeRoot.appendChild(buildNode(roots[0])); }
  else {
    const row=document.createElement('div'); row.className='children-row';
    roots.forEach(r=>{ const col=document.createElement('div'); col.className='child-col'; col.appendChild(buildNode(r)); row.appendChild(col); });
    treeRoot.appendChild(row);
  }
  const ga=document.createElement('div'); ga.style.cssText='margin-top:32px;display:flex;justify-content:center;';
  ga.innerHTML=`<button class="chip" onclick="openPersonModal(null,null)">+ Add person</button>`;
  treeRoot.appendChild(ga);
  container.appendChild(treeRoot);
  applyZoom();
}

// ── CARD ─────────────────────────────────────────────
function makeCard(person) {
  const labels=person.labels||[];
  const card=document.createElement('div'); card.className='card'; card.dataset.id=person.id;
  const fl=LABELS.find(l=>labels.includes(l.id));
  if(fl){card.style.borderLeftWidth='3px';card.style.borderLeftStyle='solid';card.style.borderLeftColor=fl.color;}
  const ini=person.initials||person.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const avEl=person.linkedin
    ?`<a class="avatar" href="${person.linkedin}" target="_blank" rel="noopener" draggable="false">${ini}</a>`
    :`<div class="avatar">${ini}</div>`;
  const labelTags=LABELS.filter(l=>labels.includes(l.id)).map(l=>`<span class="label-tag" style="background:${l.color}22;color:${l.color}">${l.label}</span>`).join('');
  const liSearch=`https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent(person.name)}`;
  const liRow=person.linkedin
    ?`<a class="card-li" href="${person.linkedin}" target="_blank" rel="noopener" draggable="false"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>linkedin</a>`
    :`<a class="card-li" style="opacity:.4;font-style:italic;" href="${liSearch}" target="_blank" rel="noopener" draggable="false"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>search on LinkedIn</a>`;
  card.innerHTML=`
    <div class="card-top">${avEl}<div class="card-info"><div class="card-name">${person.name}</div><div class="card-role">${person.role||''}</div>${labelTags?`<div class="card-labels">${labelTags}</div>`:''}</div></div>
    ${person.note?`<div class="card-note">${person.note}</div>`:''}${liRow}`;
  card.addEventListener('click',e=>{if(e.target.closest('a'))return;openPersonModal(person.id,person.parent_id);});
  // drag
  card.draggable=true;
  card.addEventListener('dragstart',e=>{dragId=person.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
  card.addEventListener('dragend',()=>{dragId=null;dragOverId=null;dragZone=null;card.classList.remove('dragging');clearDragStyles();});
  card.addEventListener('dragover',e=>{
    if(dragId===person.id)return;e.preventDefault();
    const rect=card.getBoundingClientRect();const y=e.clientY-rect.top;const h=rect.height;
    let zone=y<h*.3?'above':y>h*.7?'below':'side';
    if(dragOverId!==person.id||dragZone!==zone){
      dragOverId=person.id;dragZone=zone;clearDragStyles();
      card.classList.add(`drag-over-${zone}`);
    }
  });
  card.addEventListener('dragleave',()=>{card.classList.remove('drag-over-above','drag-over-below','drag-over-side');if(dragOverId===person.id){dragOverId=null;dragZone=null;}});
  card.addEventListener('drop',async e=>{
    e.preventDefault();
    if(!dragId||dragId===person.id)return;
    const src=currentPeople.find(p=>p.id===dragId);
    const tgt=currentPeople.find(p=>p.id===person.id);
    if(!src||!tgt)return;
    if(isDescendant(tgt.id,src.id)){showToast("Can't move to a subordinate");return;}
    const newParent=dragZone==='below'?tgt.id:(tgt.parent_id||'');
    try {
      await sb(`people?id=eq.${src.id}`,{method:'PATCH',body:{parent_id:newParent||null}});
      src.parent_id=newParent||null;
      renderTree();clearDragStyles();showToast('Reorganized ✓');
    } catch(e){showToast('Error saving');}
  });
  return card;
}

function clearDragStyles(){document.querySelectorAll('.card').forEach(c=>c.classList.remove('drag-over-above','drag-over-below','drag-over-side'));}
function isDescendant(candidateId,ancestorId){
  let cur=currentPeople.find(p=>p.id===candidateId);
  while(cur&&cur.parent_id){if(cur.parent_id===ancestorId)return true;cur=currentPeople.find(p=>p.id===cur.parent_id);}
  return false;
}

// ── PERSON MODAL ─────────────────────────────────────
function openPersonModal(personId,defaultParentId) {
  editingPersonId=personId;
  const person=personId?currentPeople.find(p=>p.id===personId):null;
  document.getElementById('mp-title').textContent=person?'Edit person':'Add person';
  document.getElementById('mp-name').value=person?.name||'';
  document.getElementById('mp-role').value=person?.role||'';
  document.getElementById('mp-linkedin').value=person?.linkedin||'';
  document.getElementById('mp-initials').value=person?.initials||'';
  document.getElementById('mp-note').value=person?.note||'';
  const grid=document.getElementById('mp-labels');
  grid.innerHTML=LABELS.map(l=>`
    <label class="lt ${(person?.labels||[]).includes(l.id)?'active':''}"
           style="${(person?.labels||[]).includes(l.id)?`background:${l.color}22;border-color:${l.color};`:''}"
           data-color="${l.color}">
      <input type="checkbox" value="${l.id}" ${(person?.labels||[]).includes(l.id)?'checked':''}><span class="dot" style="background:${l.color}"></span>${l.label}
    </label>`).join('');
  grid.querySelectorAll('.lt').forEach(el=>{
    el.addEventListener('click',()=>{
      const cb=el.querySelector('input');cb.checked=!cb.checked;const c=el.dataset.color;
      if(cb.checked){el.classList.add('active');el.style.background=c+'22';el.style.borderColor=c;}
      else{el.classList.remove('active');el.style.background='';el.style.borderColor='';}
    });
  });
  const sel=document.getElementById('mp-parent');
  sel.innerHTML='<option value="">— top of hierarchy —</option>';
  currentPeople.filter(p=>p.id!==personId).forEach(p=>{
    const opt=document.createElement('option');
    opt.value=p.id;opt.textContent=p.name+(p.role?` (${p.role})`:'');
    if((person?.parent_id===p.id)||(!person&&defaultParentId===p.id))opt.selected=true;
    sel.appendChild(opt);
  });
  document.getElementById('mp-del').style.display=person?'block':'none';
  openModal('modal-person');
  document.getElementById('mp-name').focus();
}

async function savePerson() {
  const name=document.getElementById('mp-name').value.trim();
  if(!name){alert('Name is required');return;}
  const parentId=document.getElementById('mp-parent').value||null;
  const obj={
    name,
    role:document.getElementById('mp-role').value.trim(),
    linkedin:document.getElementById('mp-linkedin').value.trim(),
    initials:document.getElementById('mp-initials').value.trim().toUpperCase(),
    note:document.getElementById('mp-note').value.trim(),
    parent_id:parentId,
    labels:[...document.querySelectorAll('#mp-labels input:checked')].map(cb=>cb.value),
    account_id:currentAccount.id,
    created_by:currentUser
  };
  try {
    if(editingPersonId) {
      await sb(`people?id=eq.${editingPersonId}`,{method:'PATCH',body:obj});
      const idx=currentPeople.findIndex(p=>p.id===editingPersonId);
      currentPeople[idx]={...currentPeople[idx],...obj};
    } else {
      const newP={id:uid(),...obj};
      await sb('people',{method:'POST',body:newP});
      currentPeople.push(newP);
    }
    renderChart();closeModal('modal-person');showToast('Saved ✓');
  } catch(e){alert('Error: '+e.message);}
}

async function deletePerson() {
  if(!editingPersonId)return;
  if(!confirm('Remove this person?'))return;
  try {
    const person=currentPeople.find(p=>p.id===editingPersonId);
    await sb(`people?id=eq.${editingPersonId}`,{method:'DELETE',prefer:'return=minimal'});
    currentPeople.forEach(p=>{if(p.parent_id===editingPersonId)p.parent_id=person?.parent_id||null;});
    currentPeople=currentPeople.filter(p=>p.id!==editingPersonId);
    renderChart();closeModal('modal-person');showToast('Removed');
  } catch(e){alert('Error: '+e.message);}
}

// ── IMPORT ───────────────────────────────────────────
async function doImport() {
  const raw=document.getElementById('import-ta').value.trim();if(!raw)return;
  try {
    const imp=JSON.parse(raw);
    if(imp.account){
      const upd={name:imp.account.name||currentAccount.name,segment:imp.account.segment||'',region:imp.account.region||currentAccount.region,bdr:imp.account.bdr||currentAccount.bdr,stage:imp.account.stage||'Prospecting',product:imp.account.product||''};
      await sb(`accounts?id=eq.${currentAccount.id}`,{method:'PATCH',body:upd});
      Object.assign(currentAccount,upd);
    }
    if(imp.people&&Array.isArray(imp.people)) {
      // delete existing people first
      await sb(`people?account_id=eq.${currentAccount.id}`,{method:'DELETE',prefer:'return=minimal'});
      const toInsert=imp.people.map(p=>({
        id:p.id||uid(),
        account_id:currentAccount.id,
        name:p.name,role:p.role||'',
        linkedin:p.linkedin||'',initials:p.initials||'',
        note:p.note||'',
        parent_id:p.parentId||null,
        labels:p.labels||[],
        created_by:currentUser
      }));
      if(toInsert.length>0) await sb('people',{method:'POST',body:toInsert});
      currentPeople=toInsert;
    }
    renderChart();
    document.getElementById('import-ta').value='';
    document.getElementById('import-panel').removeAttribute('open');
    showToast('Imported ✓');
  } catch(e){alert('Invalid JSON.\n\n'+e.message);}
}

// ── EXPORT ───────────────────────────────────────────
function exportJSON() {
  const out={
    account:currentAccount,
    people:currentPeople.map(p=>({...p,parentId:p.parent_id}))
  };
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(currentAccount?.name||'account').replace(/\s+/g,'-').toLowerCase()+'.json';
  a.click();
}

function exportImage() {
  const overlay=document.getElementById('export-overlay');
  overlay.classList.add('open');
  const offscreen=document.createElement('div');
  offscreen.style.cssText='position:fixed;top:-99999px;left:-99999px;background:#1c1f24;padding:48px;width:max-content;min-width:900px;z-index:-1;';
  document.body.appendChild(offscreen);
  const tempTree=document.createElement('div');
  tempTree.id='org-tree-off';
  offscreen.appendChild(tempTree);
  // render into offscreen
  const realTree=document.getElementById('org-tree');
  tempTree.innerHTML=realTree.innerHTML;
  // remove transform from clone
  tempTree.style.transform='none';
  setTimeout(()=>{
    html2canvas(offscreen,{
      backgroundColor:'#1c1f24',scale:2,useCORS:true,logging:false,
      width:offscreen.scrollWidth,height:offscreen.scrollHeight,
      windowWidth:offscreen.scrollWidth+200,
    }).then(canvas=>{
      document.body.removeChild(offscreen);
      overlay.classList.remove('open');
      const a=document.createElement('a');
      const name=(currentAccount?.name||'orgchart').replace(/\s+/g,'-').toLowerCase();
      a.download=`${name}-orgchart.png`;
      a.href=canvas.toDataURL('image/png');
      a.click();
      showToast('Image exported ✓');
    }).catch(e=>{
      document.body.removeChild(offscreen);
      overlay.classList.remove('open');
      showToast('Export error');
    });
  },400);
}

// ── ZOOM ─────────────────────────────────────────────
function applyZoom(){
  const tree=document.getElementById('org-tree');
  tree.style.transform=`scale(${zoomLevel})`;
  tree.style.transformOrigin='top center';
  document.getElementById('zoom-label').textContent=Math.round(zoomLevel*100)+'%';
}
function zoomIn(){zoomLevel=Math.min(1.5,+(zoomLevel+0.15).toFixed(2));applyZoom();}
function zoomOut(){zoomLevel=Math.max(0.3,+(zoomLevel-0.15).toFixed(2));applyZoom();}

// ── MODAL HELPERS ────────────────────────────────────
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-bg').forEach(bg=>{
  bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('open');});
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.querySelectorAll('.modal-bg.open').forEach(m=>m.classList.remove('open'));
});

function setRegionRadio(name, value) {
  document.querySelectorAll(`input[name="${name}"]`).forEach(inp=>{
    inp.checked=inp.value===value;
    inp.closest('.ro').classList.toggle('sel',inp.checked);
  });
  document.querySelectorAll(`input[name="${name}"]`).forEach(inp=>{
    inp.onchange=()=>{
      document.querySelectorAll(`input[name="${name}"]`).forEach(i=>i.closest('.ro').classList.remove('sel'));
      inp.closest('.ro').classList.add('sel');
    };
  });
}

// ── UTILS ────────────────────────────────────────────
function uid(){return Math.random().toString(36).slice(2,10);}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── START ────────────────────────────────────────────
init();
</script>
