name: Weekly Supabase Backup

on:
  schedule:
    - cron: '0 23 * * 1,3,5'  # Mon, Wed, Fri at 11pm UTC (8pm BRT)
  workflow_dispatch:        # allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Export accounts
        run: |
          mkdir -p backups
          DATE=$(date +%Y-%m-%d)

          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://dnbgdzgdlkakmvvhvlfj.supabase.co/rest/v1/accounts?select=*" \
            -o backups/accounts_${DATE}.json

          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://dnbgdzgdlkakmvvhvlfj.supabase.co/rest/v1/people?select=*" \
            -o backups/people_${DATE}.json

          echo "✓ Backup done: ${DATE}"

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: $(date +%Y-%m-%d)"
          git push
