name: Supabase Keep Alive
 
on:
  schedule:
    - cron: '0 9 */6 * *'  # every 6 days at 9am UTC
  workflow_dispatch:         # allow manual trigger
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://dnbgdzgdlkakmvvhvlfj.supabase.co/rest/v1/accounts?select=id&limit=1"
          echo "✓ Supabase pinged"
 
